<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nur noch kurz kündigen — technische Probe</title>
  <!-- ausdrücklich leerer eingebetteter Favicon-Verweis: verhindert /favicon.ico-404 ohne zusätzliche Datei -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <header class="page-head">
    <h1>Nur noch kurz kündigen</h1>
    <p class="subtitle">Technische Probefassung — Empfangsraum</p>
  </header>

  <main id="main">
    <section class="scene" aria-label="Empfangsraum">
      <button id="btn-mira" class="hotspot" type="button">
        <span class="figure" aria-hidden="true">
          <span class="head"></span>
          <span class="body"></span>
        </span>
        <span class="hotspot-label">MIRA (Gespräch)</span>
      </button>

      <button id="btn-terminal" class="hotspot" type="button">
        <span class="terminal" aria-hidden="true">
          <span class="screen"></span>
          <span class="base"></span>
        </span>
        <span class="hotspot-label">Auskunftsterminal</span>
      </button>
    </section>

    <p id="status-line" class="status" role="status" aria-live="polite"></p>

    <section id="dialogue-panel" class="panel" hidden aria-label="Gespräch mit MIRA">
      <div class="panel-head">
        <h2 id="dialogue-speaker"></h2>
        <button id="btn-dialogue-close" type="button">Gespräch schließen</button>
      </div>
      <p id="dialogue-text" class="dialogue-text"></p>
      <div class="panel-actions">
        <button id="btn-dialogue-next" class="primary" type="button">Weiter</button>
      </div>
    </section>

    <section id="evidence-panel" class="panel" hidden aria-label="Beweisordner">
      <div class="panel-head">
        <h2>Beweisordner</h2>
        <button id="btn-evidence-close" type="button">Ordner schließen</button>
      </div>
      <div id="evidence-list"></div>
    </section>

    <section id="contradiction-panel" class="panel" hidden aria-label="Widerspruchsverfahren">
      <div class="panel-head">
        <h2>Widerspruchsverfahren 1</h2>
        <button id="btn-contradiction-close" type="button">Schließen</button>
      </div>
      <p class="claim-by">Behauptung von MIRA:</p>
      <blockquote id="contradiction-claim"></blockquote>
      <div id="contradiction-body"></div>
    </section>

    <p id="progress-line" class="progress" role="status" aria-live="polite"></p>

    <div class="toolbar">
      <button id="btn-evidence" type="button">Beweisordner öffnen</button>
      <button id="btn-contradiction" type="button">Widerspruchsverfahren</button>
      <button id="btn-restart" class="danger" type="button">Neustart</button>
    </div>
  </main>

  <script src="js/content.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
